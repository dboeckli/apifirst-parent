http:
  method: GET
  url: http://localhost:{{application-port}}/v1/orders
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
    - name: traceparent
      value: 00-{{traceId}}-{{spanId}}-03
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const orderId = bru.getVar("orderId");
        test("listOrders returns 200", function () {
            expect(res.status === 200, "expected 200 but got " + res.status).to.be.true;
        });
        test("listOrders contains the created order", function () {
            expect(res.body.some((order) => order.id === orderId), "order " + orderId + " missing in list").to.be.true;
        });

