info:
  name: 5) get the order by id
  type: http
  seq: 5

http:
  method: GET
  url: http://localhost:{{application-port}}/v1/orders/{{orderId}}
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
    - name: traceparent
      value: 00-{{traceId}}-{{spanId}}-03
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("getOrderById returns 200", function () {
            expect(res.status === 200, "expected 200 but got " + res.status).to.be.true;
        });
        test("returned order id matches", function () {
            expect(res.body.id === bru.getVar("orderId"), "orderId mismatch").to.be.true;
        });
        test("returned order references the created customer", function () {
            expect(res.body.customer.id === bru.getVar("customerId"), "customerId mismatch").to.be.true;
        });
        test("returned order has the created order line", function () {
            expect(res.body.orderLines.length === 1, "unexpected number of order lines").to.be.true;
            expect(res.body.orderLines[0].orderQuantity === 2, "unexpected orderQuantity").to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

