info:
  name: 4) create an order with one order line (sets {{orderId}} from the Location header)
  type: http
  seq: 4

http:
  method: POST
  url: http://localhost:{{application-port}}/v1/orders
  headers:
    - name: Accept
      value: application/json
    - name: traceparent
      value: 00-{{traceId}}-{{spanId}}-03
  body:
    type: json
    data: |-
      {
        "customerId": "{{customerId}}",
        "selectPaymentMethodId": "{{paymentMethodId}}",
        "orderLines": [
          {
            "productId": "{{productId}}",
            "orderQuantity": 2
          }
        ]
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const location = res.getHeader("Location");
        bru.setVar("orderId", location ? location.split("/").pop() : null);
        console.log("Created order id: " + bru.getVar("orderId"));

        test("createOrder returns 201", function () {
            expect(res.status === 201, "expected 201 but got " + res.status).to.be.true;
        });
        test("createOrder returns a Location header", function () {
            expect(!!location, "Location header missing").to.be.true;
            expect(!!bru.getVar("orderId"), "orderId missing in Location header").to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

