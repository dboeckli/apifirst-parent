info:
  name: Get a list of customers
  type: http
  seq: 1
  tags:
    - Customer

http:
  method: GET
  url: "http://localhost:{{application-port}}/v1/customers"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
