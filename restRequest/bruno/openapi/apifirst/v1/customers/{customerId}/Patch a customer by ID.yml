  type: http
  seq: 3
  tags:
    - Customer

http:
  method: PATCH
  url: "http://localhost:{{application-port}}/v1/customers/:customerId"
  params:
    - name: customerId
      value: ""
      type: path
      description: The ID value of the customer. This value is a UUID.
  body:
    type: json
    data: |-
      {
        "id": "",
        "name": {
          "prefix": "Mr.",
          "firstName": "John",
          "lastName": "Thompson",
          "suffix": ""
        },
        "shipToAddress": {
          "id": "",
          "addressLine1": "123 Main Street",
          "addressLine2": "",
          "city": "St Petersburg",
          "state": "FL",
          "zip": 33701
        },
        "billToAddress": {
          "id": "",
          "addressLine1": "123 Main Street",
          "addressLine2": "",
          "city": "St Petersburg",
          "state": "FL",
          "zip": 33701
        },
        "email": "dboeckli@gmail.com",
        "phone": "+1 (123) 456-7890",
        "paymentMethods": [
          {
            "id": "",
            "displayName": "My Chase Card",
            "cardNumber": 1234567890123456,
            "expiryMonth": 7,
            "expiryYear": 26,
            "cvv": 123
          }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

