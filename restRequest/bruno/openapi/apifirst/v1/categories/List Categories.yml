info:
  name: List Categories
  type: http
  seq: 1
  tags:
    - Product

http:
  method: GET
  url: "http://localhost:{{application-port}}/v1/categories"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 Response
    description: successful operation
    request:
      url: "http://localhost:{{application-port}}/v1/categories"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "id": "",
              "category": "Electronics",
              "description": "Electronics and Gadgets",
              "category_code": "ELECTRONICS",
              "dateCreated": "2022-08-22T11:43:06-07:00",
              "dateUpdated": "2022-08-22T11:43:06-07:00"
            }
          ]
  - name: 400 Response
    description: Request was received but was invalid. Check format and content of the request.  See the problem detail for more information.
    request:
      url: "http://localhost:{{application-port}}/v1/categories"
      method: GET
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "type": "",
            "title": "",
            "status": 0,
            "detail": "",
            "instance": ""
          }
  - name: 404 Response
    description: The requested resource was not found.
    request:
      url: "http://localhost:{{application-port}}/v1/categories"
      method: GET
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "type": "",
            "title": "",
            "status": 0,
            "detail": "",
            "instance": ""
          }

