info:
  name: Patch a order by ID
  type: http
  seq: 3
  tags:
    - Order

http:
  method: PATCH
  url: "http://localhost:{{application-port}}/v1/orders/:orderId"
  params:
    - name: orderId
      value: ""
      type: path
      description: The ID value of the order. This value is a UUID.
  body:
    type: json
    data: |-
      {
        "customerId": "",
        "selectPaymentMethodId": "",
        "orderLines": [
          {
            "id": "",
            "productId": "",
            "orderQuantity": 2
          }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

