info:
  name: 1) list customers and pick the first one (sets {{customerId}} and {{originalFirstName}})
  type: http
  seq: 1

http:
  method: GET
  url: http://localhost:{{application-port}}/v1/customers
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
    - name: traceparent
      value: 00-{{traceId}}-{{spanId}}-03
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const customers = res.body || [];
        const customer = customers[0];

        bru.setVar("customerId", customer ? customer.id : null);
        bru.setVar("originalFirstName", customer ? customer.name.firstName : null);
        console.log("Picked customer id: " + bru.getVar("customerId"));

        test("listCustomers returns 200", function () {
            expect(res.status === 200, "expected 200 but got " + res.status).to.be.true;
        });
        test("listCustomers is not empty", function () {
            expect(customers.length > 0, "no customers found - create one first").to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Flow: listCustomers -> getCustomerById -> patchCustomerById -> patchCustomerById (restore) — see restRequest/customer-flow-list-get-patch/customer-flow-list-get-patch.md
  Requires the JPA profile (local-with-jpa / k8s-wiht-jpa): PATCH is not implemented in apifirst-server.

