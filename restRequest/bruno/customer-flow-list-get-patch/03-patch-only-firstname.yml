info:
  name: 3) patch only firstName (lastName stays untouched)
  type: http
  seq: 3

http:
  method: PATCH
  url: http://localhost:{{application-port}}/v1/customers/{{customerId}}
  headers:
    - name: Accept
      value: application/json
    - name: traceparent
      value: 00-{{traceId}}-{{spanId}}-03
  body:
    type: json
    data: |-
      {
        "name": {
          "firstName": "patched"
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // JPA-only requests (PATCH/DELETE and their verification) are skipped by the
        // Bruno runner when the selected environment is not a JPA profile
        // (see environments/*.yml).
        // IntelliJ has no `bru` global; the guard short-circuits there.
        if (typeof bru !== "undefined" && bru.runner && bru.getEnvVar("profile") !== "jpa") {
            bru.runner.skipRequest();
        }
        const customerId = bru.getVar("customerId");
        console.log("patchCustomerById -> customerId=" + customerId);
        if (!customerId) {
            throw new Error("customerId is not set - run 'list customers' first");
        }
    - type: tests
      code: |-
        bru.setVar("patchedFirstName", res.body ? res.body.name.firstName : null);

        test("patchCustomerById returns 200", function () {
            expect(res.status === 200, "expected 200 but got " + res.status).to.be.true;
        });
        test("firstName was patched", function () {
            expect(res.body.name.firstName === "patched", "firstName not patched").to.be.true;
            expect(!!res.body.name.lastName, "lastName was removed by the patch").to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

