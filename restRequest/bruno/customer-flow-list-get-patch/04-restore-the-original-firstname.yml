info:
  name: 4) restore the original firstName
  type: http
  seq: 4

http:
  method: PATCH
  url: http://localhost:{{application-port}}/v1/customers/{{customerId}}
  headers:
    - name: Accept
      value: application/json
    - name: traceparent
      value: 00-{{traceId}}-{{spanId}}-03
  body:
    type: json
    data: |-
      {
        "name": {
          "firstName": "{{originalFirstName}}"
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // JPA-only requests (PATCH/DELETE and their verification) are skipped by the
        // Bruno runner when the selected environment is not a JPA profile
        // (see environments/*.yml).
        // IntelliJ has no `bru` global; the guard short-circuits there.
        if (typeof bru !== "undefined" && bru.runner && bru.getEnvVar("profile") !== "jpa") {
            bru.runner.skipRequest();
        }
    - type: tests
      code: |-
        test("restore returns 200", function () {
            expect(res.status === 200, "expected 200 but got " + res.status).to.be.true;
        });
        test("original firstName is restored", function () {
            expect(res.body.name.firstName === bru.getVar("originalFirstName"), "firstName was not restored").to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

