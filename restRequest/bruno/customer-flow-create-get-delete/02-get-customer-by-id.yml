info:
  name: 2) get customer by id (logs and checks {{customerId}} before sending)
  type: http
  seq: 2

http:
  method: GET
  url: http://localhost:{{application-port}}/v1/customers/{{customerId}}
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
    - name: traceparent
      value: 00-{{traceId}}-{{spanId}}-03
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const customerId = bru.getVar("customerId");
        console.log("getCustomerById -> customerId=" + customerId);
        if (!customerId) {
            throw new Error("customerId is not set - run 'create a customer' first");
        }
    - type: tests
      code: |-
        test("getCustomerById returns 200", function () {
            expect(res.status === 200, "expected 200 but got " + res.status).to.be.true;
        });
        test("returned customer id matches", function () {
            expect(res.body.id === bru.getVar("customerId"), "customerId mismatch").to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

