info:
  name: 3) delete the customer by id (fresh customer has no orders)
  type: http
  seq: 3

http:
  method: DELETE
  url: http://localhost:{{application-port}}/v1/customers/{{customerId}}
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
    - name: traceparent
      value: 00-{{traceId}}-{{spanId}}-03
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // JPA-only requests (PATCH/DELETE and their verification) are skipped by the
        // Bruno runner when the selected environment is not a JPA profile
        // (see environments/*.yml).
        // IntelliJ has no `bru` global; the guard short-circuits there.
        if (typeof bru !== "undefined" && bru.runner && bru.getEnvVar("profile") !== "jpa") {
            bru.runner.skipRequest();
        }
        const customerId = bru.getVar("customerId");
        console.log("deleteCustomerById -> customerId=" + customerId);
        if (!customerId) {
            throw new Error("customerId is not set - run 'create a customer' first");
        }
    - type: tests
      code: |-
        test("deleteCustomerById returns 204", function () {
            expect(res.status === 204, "expected 204 but got " + res.status).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

