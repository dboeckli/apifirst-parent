info:
  name: 3) patch only the description (other fields stay untouched)
  type: http
  seq: 3

http:
  method: PATCH
  url: http://localhost:{{application-port}}/v1/products/{{productId}}
  headers:
    - name: Accept
      value: application/json
    - name: traceparent
      value: 00-{{traceId}}-{{spanId}}-03
  body:
    type: json
    data: |-
      {
        "description": "flow product (patched)",
        "price": "9.95"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("patchProductById returns 200", function () {
            expect(res.status === 200, "expected 200 but got " + res.status).to.be.true;
        });
        test("description was patched", function () {
            expect(res.body.description === "flow product (patched)", "description not patched").to.be.true;
            expect(res.body.price === "9.95", "price not patched").to.be.true;
            expect(!!res.body.cost, "cost was removed by the patch").to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

