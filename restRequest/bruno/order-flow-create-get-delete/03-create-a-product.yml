info:
  name: 3) create a product (sets {{productId}} from the Location header)
  type: http
  seq: 3

http:
  method: POST
  url: http://localhost:{{application-port}}/v1/products
  headers:
    - name: Accept
      value: application/json
    - name: traceparent
      value: 00-{{traceId}}-{{spanId}}-03
  body:
    type: json
    data: |-
      {
        "description": "flow order product",
        "cost": "5.00",
        "price": "8.95",
        "categories": ["{{product-category-code}}"]
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const location = res.getHeader("Location");
        bru.setVar("productId", location ? location.split("/").pop() : null);
        console.log("Created product id: " + bru.getVar("productId"));

        test("createProduct returns 201", function () {
            expect(res.status === 201, "expected 201 but got " + res.status).to.be.true;
        });
        test("createProduct returns a Location header", function () {
            expect(!!location, "Location header missing").to.be.true;
            expect(!!bru.getVar("productId"), "productId missing in Location header").to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

