info:
  name: 2) get the customer and remember the payment method id (sets {{paymentMethodId}})
  type: http
  seq: 2

http:
  method: GET
  url: http://localhost:{{application-port}}/v1/customers/{{customerId}}
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
    - name: traceparent
      value: 00-{{traceId}}-{{spanId}}-03
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const paymentMethods = res.body.paymentMethods || [];
        const paymentMethod = paymentMethods[0];
        bru.setVar("paymentMethodId", paymentMethod ? paymentMethod.id : null);
        console.log("Picked paymentMethodId: " + bru.getVar("paymentMethodId"));

        test("getCustomerById returns 200", function () {
            expect(res.status === 200, "expected 200 but got " + res.status).to.be.true;
        });
        test("customer has a payment method", function () {
            expect(paymentMethods.length > 0, "no payment method found").to.be.true;
            expect(!!bru.getVar("paymentMethodId"), "paymentMethodId missing").to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

