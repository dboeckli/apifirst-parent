info:
  name: 1) create a customer with a payment method (sets {{customerId}} from the Location header)
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:{{application-port}}/v1/customers
  headers:
    - name: Accept
      value: application/json
    - name: traceparent
      value: 00-{{traceId}}-{{spanId}}-03
  body:
    type: json
    data: |-
      {
        "name": {
          "firstName": "flow",
          "lastName": "order"
        },
        "shipToAddress": {
          "addressLine1": "123 Main Street",
          "city": "New York",
          "state": "NY",
          "zip": "10001"
        },
        "billToAddress": {
          "addressLine1": "123 Main Street",
          "city": "New York",
          "state": "NY",
          "zip": "10001"
        },
        "email": "flow.order@example.com",
        "phone": "1234567890",
        "paymentMethods": [
          {
            "displayName": "Flow Card",
            "cardNumber": 12341234,
            "expiryMonth": 12,
            "expiryYear": 30,
            "cvv": 123
          }
        ]
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const location = res.getHeader("Location");
        bru.setVar("customerId", location ? location.split("/").pop() : null);
        console.log("Created customer id: " + bru.getVar("customerId"));

        test("createCustomer returns 201", function () {
            expect(res.status === 201, "expected 201 but got " + res.status).to.be.true;
        });
        test("createCustomer returns a Location header", function () {
            expect(!!location, "Location header missing").to.be.true;
            expect(!!bru.getVar("customerId"), "customerId missing in Location header").to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Flow: createCustomer -> createProduct -> createOrder -> getOrderById -> deleteOrderById -> getOrderById (404) — see restRequest/order-flow-create-get-delete/order-flow-create-get-delete.md
  Requires the JPA profile (local-with-jpa / k8s-with-jpa): DELETE is not implemented in apifirst-server.
  Bruno skips these requests automatically when the selected environment is not a JPA profile (scripts/jpa-only.js).

  Source: order-flow-create-get-delete/order-flow-create-get-delete.http
