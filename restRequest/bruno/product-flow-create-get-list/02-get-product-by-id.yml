http:
  method: GET
  url: http://localhost:{{application-port}}/v1/products/{{productId}}
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
    - name: traceparent
      value: 00-{{traceId}}-{{spanId}}-03
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("getProductById returns 200", function () {
            expect(res.status === 200, "expected 200 but got " + res.status).to.be.true;
        });
        test("returned product id matches", function () {
            expect(res.body.id === bru.getVar("productId"), "productId mismatch").to.be.true;
        });
        test("returned product matches the payload", function () {
            expect(res.body.description === "flow product", "unexpected description").to.be.true;
            expect(res.body.price === "8.95", "unexpected price").to.be.true;
        });

