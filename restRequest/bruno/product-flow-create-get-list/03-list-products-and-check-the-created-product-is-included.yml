info:
  name: 3) list products and check the created product is included
  type: http
  seq: 3

http:
  method: GET
  url: http://localhost:{{application-port}}/v1/products
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
    - name: traceparent
      value: 00-{{traceId}}-{{spanId}}-03
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const productId = bru.getVar("productId");
        test("listProducts returns 200", function () {
            expect(res.status === 200, "expected 200 but got " + res.status).to.be.true;
        });
        test("listProducts contains the created product", function () {
            expect(res.body.some((product) => product.id === productId), "product " + productId + " missing in list").to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

