info:
  name: 1) create a product (sets {{productId}} from the Location header)
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:{{application-port}}/v1/products
  headers:
    - name: Accept
      value: application/json
    - name: traceparent
      value: 00-{{traceId}}-{{spanId}}-03
  body:
    type: json
    data: |-
      {
        "description": "flow product",
        "cost": "5.00",
        "price": "8.95",
        "categories": ["{{product-category-code}}"],
        "dimensions": {
          "length": 10,
          "width": 10,
          "height": 10
        },
        "images": [
          {
            "url": "http://example.com/flow-product.jpg",
            "altText": "Flow product"
          }
        ]
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const location = res.getHeader("Location");
        bru.setVar("productId", location ? location.split("/").pop() : null);
        console.log("Created product id: " + bru.getVar("productId"));

        test("createProduct returns 201", function () {
            expect(res.status === 201, "expected 201 but got " + res.status).to.be.true;
        });
        test("createProduct returns a Location header", function () {
            expect(!!location, "Location header missing").to.be.true;
            expect(!!bru.getVar("productId"), "productId missing in Location header").to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Flow: createProduct -> getProductById -> listProducts — see restRequest/product-flow-create-get-list/product-flow-create-get-list.md

