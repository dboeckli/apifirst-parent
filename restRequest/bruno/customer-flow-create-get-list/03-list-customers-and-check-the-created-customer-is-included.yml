info:
  name: 3) list customers and check the created customer is included
  type: http
  seq: 3

http:
  method: GET
  url: http://localhost:{{application-port}}/v1/customers
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
    - name: traceparent
      value: 00-{{traceId}}-{{spanId}}-03
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const customerId = bru.getVar("customerId");
        test("listCustomers returns 200", function () {
            expect(res.status === 200, "expected 200 but got " + res.status).to.be.true;
        });
        test("listCustomers contains the created customer", function () {
            expect(res.body.some((customer) => customer.id === customerId), "customer " + customerId + " missing in list").to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

