info:
  name: 1) create a customer (sets {{customerId}} from the Location header)
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:{{application-port}}/v1/customers
  headers:
    - name: Accept
      value: application/json
    - name: traceparent
      value: 00-{{traceId}}-{{spanId}}-03
  body:
    type: json
    data: |-
      {
        "name": {
          "firstName": "flow",
          "lastName": "customer"
        },
        "shipToAddress": {
          "addressLine1": "123 Main Street",
          "city": "New York",
          "state": "NY",
          "zip": "10001"
        },
        "billToAddress": {
          "addressLine1": "123 Main Street",
          "city": "New York",
          "state": "NY",
          "zip": "10001"
        },
        "email": "flow.customer@example.com",
        "phone": "1234567890"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const location = res.getHeader("Location");
        bru.setVar("customerId", location ? location.split("/").pop() : null);
        console.log("Created customer id: " + bru.getVar("customerId"));

        test("createCustomer returns 201", function () {
            expect(res.status === 201, "expected 201 but got " + res.status).to.be.true;
        });
        test("createCustomer returns a Location header", function () {
            expect(!!location, "Location header missing").to.be.true;
            expect(!!bru.getVar("customerId"), "customerId missing in Location header").to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Flow: createCustomer -> getCustomerById -> listCustomers — see restRequest/customer-flow-create-get-list/customer-flow-create-get-list.md

