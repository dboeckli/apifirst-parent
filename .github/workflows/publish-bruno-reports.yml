name: Publish Bruno Reports
run-name: >
  Publish Bruno reports for ${{ github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: ["Deploy and Test Cluster"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Aggregate Bruno reports from completed deploy runs
        id: aggregate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -o nounset
          set -o errexit
          set -o pipefail

          workflow_file="deploy-and-test-cluster.yml"
          artifact_prefix="bruno-reports-"
          site="_site"
          runs_file=$(mktemp)
          run_ids_file=$(mktemp)
          artifacts_file=$(mktemp)

          rm -rf "$site"
          mkdir -p "$site/reports"

          list_runs() {
            gh api "repos/$REPO/actions/workflows/$workflow_file/runs?head_sha=$HEAD_SHA&per_page=100" \
              --jq '.workflow_runs'
          }

          # Both module deployments are dispatched as separate workflow runs for the
          # same commit. Wait until no run for this commit is queued or in progress
          # and that state has been stable for a while, so the first run does not
          # publish a page that is missing the second module's reports.
          stable_checks=0
          deadline=$((SECONDS + 600))
          while true; do
            list_runs > "$runs_file"
            total_runs=$(jq 'length' < "$runs_file")
            pending_runs=$(jq '[.[] | select(.status != "completed")] | length' < "$runs_file")

            if [ "$total_runs" -gt 0 ] && [ "$pending_runs" -eq 0 ]; then
              stable_checks=$((stable_checks + 1))
              if [ "$stable_checks" -ge 3 ]; then
                break
              fi
            else
              stable_checks=0
            fi

            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::Timed out waiting for the deploy runs of $HEAD_SHA to complete"
              jq -r '.[] | "\(.id) \(.status) \(.conclusion) \(.html_url)"' < "$runs_file"
              exit 1
            fi
            sleep 10
          done

          # Newest run first; keep the first artifact per application name so
          # re-runs do not add duplicate reports for the same module.
          jq -r 'sort_by(.created_at) | reverse | .[].id' < "$runs_file" > "$run_ids_file"
          : > "$artifacts_file"
          while IFS= read -r run_id; do
            gh api "repos/$REPO/actions/runs/$run_id/artifacts?per_page=100" \
              | jq -r --arg run_id "$run_id" \
                '.artifacts[]
                 | select(.name | startswith("'"$artifact_prefix"'"))
                 | [.name, $run_id]
                 | @tsv' \
              >> "$artifacts_file"
          done < "$run_ids_file"

          awk '!seen[$1]++' "$artifacts_file" > "$artifacts_file.unique"

          applications=""
          while IFS=$'\t' read -r artifact_name run_id; do
            [ -n "$artifact_name" ] || continue
            application="${artifact_name#"$artifact_prefix"}"
            echo "Downloading $artifact_name from run $run_id"
            if ! gh run download "$run_id" --repo "$REPO" --name "$artifact_name" --dir "$site/reports/$application"; then
              echo "::warning::Could not download $artifact_name from run $run_id (expired?)"
              continue
            fi
            applications="$applications $application"
          done < "$artifacts_file.unique"

          report_count=$(find "$site/reports" -name '*.html' -type f | wc -l)
          if [ "$report_count" -eq 0 ]; then
            echo "::notice::No Bruno reports found for $HEAD_SHA - Pages is left untouched"
            echo "has_reports=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_reports=true" >> "$GITHUB_OUTPUT"

          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}"
          {
            printf '%s\n' '<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Bruno reports</title></head><body>'
            printf '<h1>Bruno API reports</h1>\n'
            printf '<p>Commit: <code>%s</code></p>\n' "$HEAD_SHA"
            printf '<p>Deploy workflow run: <a href="%s">%s</a></p>\n' "$run_url" "$run_url"
            for application in $applications; do
              [ -d "$site/reports/$application" ] || continue
              printf '<h2>%s</h2>\n<ul>\n' "$application"
              for report in "$site/reports/$application"/*.html; do
                [ -f "$report" ] || continue
                report_name=$(basename "$report")
                printf '  <li><a href="reports/%s/%s">%s</a></li>\n' "$application" "$report_name" "$report_name"
              done
              printf '</ul>\n'
            done
            printf '%s\n' '</body></html>'
          } > "$site/index.html"

      - name: Configure Pages
        if: steps.aggregate.outputs.has_reports == 'true'
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload Pages artifact
        if: steps.aggregate.outputs.has_reports == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          # Unique per attempt: re-runs would otherwise leave a second github-pages artifact.
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.aggregate.outputs.has_reports == 'true'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Add report link to summary
        if: always() && steps.aggregate.outputs.has_reports == 'true'
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          if [ -n "${PAGE_URL:-}" ]; then
            {
              echo "### Bruno reports"
              echo "$PAGE_URL"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
