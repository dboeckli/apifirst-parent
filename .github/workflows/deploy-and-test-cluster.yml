name: Deploy and Test Cluster
run-name: >
  ${{ github.workflow }} ${{ inputs.version }}: ${{ github.event_name }} for ${{ github.ref_name }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        description: 'Version to deploy'
        required: true
      helm-chart-version:
        type: string
        description: 'Helm Chart Version'
        required: true
      deployed-by-build:
        type: string
        description: 'Build number of trigger build'
        required: true
        default: 'None'
      deployed-by-workflow:
        type: string
        description: 'Name of trigger workflow'
        required: true
        default: 'None'

jobs:
  deploy-app-with-helm:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - application-name: apifirst-server
            namespace: apifirst-server
          - application-name: apifirst-server-jpa
            namespace: apifirst-server-jpa

    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Show Version
        env:
          APPLICATION_NAME: ${{ matrix.application-name }}
          APP_VERSION: ${{ inputs.version }}
          HELM_CHART_VERSION: ${{ inputs.helm-chart-version }}
          NAMESPACE: ${{ matrix.namespace }}
          DEPLOYED_BY_WORKFLOW: ${{ inputs.deployed-by-workflow }}
          DEPLOYED_BY_BUILD: ${{ inputs.deployed-by-build }}
        run: |
          echo "Deploying Application $APPLICATION_NAME with Version: $APP_VERSION, Helm chart version: $HELM_CHART_VERSION, to namespace $NAMESPACE"
          echo "Deployment triggered by workflow $DEPLOYED_BY_WORKFLOW. Run number: $DEPLOYED_BY_BUILD"

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create k8s Kind Cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1

      - name: Pull Helm Chart
        env:
          HELM_CHART_VERSION: ${{ inputs.helm-chart-version }}
          DOCKER_USER: ${{ vars.DOCKER_USER }}
          APPLICATION_NAME: ${{ matrix.application-name }}
        run: |
          echo "Pulling Helm Chart Version: $HELM_CHART_VERSION"
          helm pull oci://registry-1.docker.io/$DOCKER_USER/$APPLICATION_NAME-chart --version "$HELM_CHART_VERSION"
          tar -xvf $APPLICATION_NAME-*.tgz  

      - name: Deploy application with Helm
        env:
          APP_VERSION: ${{ inputs.helm-chart-version }}
          APPLICATION_NAME: ${{ matrix.application-name }}
          NAMESPACE: ${{ matrix.namespace }}
        run: |
          # Install/upgrade the Helm chart
          echo "Deploying Application: $APP_VERSION"
          helm upgrade --install $APPLICATION_NAME ./$APPLICATION_NAME-chart \
          --namespace ${NAMESPACE} \
          --create-namespace \
          --wait --timeout 5m \
          --debug

      - name: Wait for Pods to be ready
        env:
          APP_VERSION: ${{ inputs.helm-chart-version }}
          NAMESPACE: ${{ matrix.namespace }}
          APPLICATION_NAME: ${{ matrix.application-name }}
          DEPLOYED_BY_WORKFLOW: ${{ inputs.deployed-by-workflow }}
          DEPLOYED_BY_BUILD: ${{ inputs.deployed-by-build }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if ! kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=$APPLICATION_NAME -n $NAMESPACE --timeout=180s; then
            POD_NAME=$(kubectl get pods -l app.kubernetes.io/name=$APPLICATION_NAME -o jsonpath="{.items[0].metadata.name}" -n $NAMESPACE)
            kubectl logs $POD_NAME -n $NAMESPACE
            echo "Describing the pod:"
            kubectl describe pod $POD_NAME -n $NAMESPACE
            exit 1
          fi
          BUILD_LINK="$SERVER_URL/$REPOSITORY/actions/runs/$DEPLOYED_BY_BUILD"
          echo "::notice:: ### Helm Deployment: Application $APPLICATION_NAME, Version: $APP_VERSION"
          echo "::notice:: ### Deployment triggered by workflow $DEPLOYED_BY_WORKFLOW. Run number: $DEPLOYED_BY_BUILD: $BUILD_LINK"

      - name: Test Application
        env:
          APP_VERSION: ${{ inputs.helm-chart-version }}
          APPLICATION_NAME: ${{ matrix.application-name }}
          NAMESPACE: ${{ matrix.namespace }}
        run: |
          echo "Testing Application $APPLICATION_NAME: $APP_VERSION"
          TEST_OUTPUT=$(helm test $APPLICATION_NAME --namespace ${NAMESPACE} --logs)
          TEST_EXIT_CODE=$?
          
          echo "::group::Helm Test Raw Output"
          echo "Exit Code: $TEST_EXIT_CODE"
          echo "$TEST_OUTPUT"
          echo "::endgroup::"

          # Check all test exit codes
          if echo "$TEST_OUTPUT" | grep -q "Exit code: [^0]"; then
            echo "::error::One or more Helm tests failed. See details below:"
            exit 1
          elif [ $TEST_EXIT_CODE -ne 0 ]; then
            echo "::error::Helm test command failed with exit code $TEST_EXIT_CODE"
            exit $TEST_EXIT_CODE
          else
            echo "All Helm tests passed successfully."
          fi

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install Bruno tooling
        run: |
          cd restRequest/bruno/tools
          npm ci --ignore-scripts
          # The npm registry occasionally serves package metadata before the
          # tarball is available. npm does not retry 404s, so retry the whole
          # install instead of relying on a single attempt.
          for attempt in 1 2 3; do
            if npm install -g --ignore-scripts @usebruno/cli@4.2.1; then
              echo "Bruno CLI installed (attempt $attempt)"
              break
            fi
            echo "::warning::npm install failed (attempt $attempt), retrying..."
            npm cache clean --force || true
            sleep 15
          done
          bru --version

      - name: Verify generated Bruno collection
        run: |
          cd restRequest/bruno
          node tools/http-to-bru.mjs --source .. --check

      - name: Run Bruno flows
        working-directory: restRequest/bruno
        env:
          APPLICATION_NAME: ${{ matrix.application-name }}
          NAMESPACE: ${{ matrix.namespace }}
        run: |
          set -o pipefail
          set -o nounset
          set -o errexit

          if [[ "$APPLICATION_NAME" == *-jpa ]]; then
            PORT=8082
            ENV_NAME=k8s-with-jpa
          else
            PORT=8081
            ENV_NAME=k8s
          fi

          # JPA-only requests (PATCH/DELETE) skip themselves in non-JPA
          # environments, so every flow runs for both modules.
          FLOWS="actuator customer-flow-create-get-list customer-flow-create-get-delete customer-flow-list-get-patch order-flow-create-get-list order-flow-create-get-delete product-flow-create-get-list product-flow-create-patch-delete"

          kubectl port-forward svc/"$APPLICATION_NAME" "$PORT:$PORT" -n "$NAMESPACE" > /tmp/port-forward.log 2>&1 &
          PORT_FORWARD_PID=$!
          trap 'kill $PORT_FORWARD_PID 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl -fsS "http://localhost:$PORT/actuator/health/readiness" > /dev/null; then
              echo "Application reachable via port-forward (attempt $attempt)"
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "::error::Application not reachable via port-forward"
              cat /tmp/port-forward.log
              exit 1
            fi
            sleep 2
          done

          mkdir -p "$GITHUB_WORKSPACE/bru-reports"
          for flow in $FLOWS; do
            echo "::group::Bruno flow: $flow"
            bru run "$flow" -r --env "$ENV_NAME" --env-var "application-port=$PORT" \
              --reporter-junit "$GITHUB_WORKSPACE/bru-reports/TEST-bruno-$flow.xml" \
              --reporter-html "$GITHUB_WORKSPACE/bru-reports/bru-report-$flow.html"
            echo "::endgroup::"
          done

      - name: Upload Bruno reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bruno-reports-${{ matrix.application-name }}
          path: bru-reports/
          if-no-files-found: warn

      - name: Publish Bruno test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d # v2.25.0
        with:
          files: bru-reports/TEST-bruno-*.xml
          check_name: Bruno API flows (${{ matrix.application-name }})
          comment_mode: "off"
          fail_on: test failures
          action_fail: true

      - name: Display Deployment Information
        env:
          NAMESPACE: ${{ matrix.namespace }}
          APPLICATION_NAME: ${{ matrix.application-name }}
        if: always()
        run: |
          echo "Deployment Information:"
          
          echo "--- Pods in $NAMESPACE namespace:"
          kubectl get pods -n $NAMESPACE
          
          echo "--- Describe pods in $NAMESPACE namespace:"
          kubectl describe pods -n $NAMESPACE
          
          echo "--- Show Events in $NAMESPACE namespace:"
          kubectl get events --sort-by=.metadata.creationTimestamp -n $NAMESPACE
          
          echo "--- Show Logs (if pods exist)"
          PODS=$(kubectl get pods -l app.kubernetes.io/name=$APPLICATION_NAME -o jsonpath="{.items[*].metadata.name}" -n $NAMESPACE)
          if [ -n "$PODS" ]; then
            for POD in $PODS; do
              echo "---------------- Logs for pod $POD:"
              kubectl logs $POD -n $NAMESPACE --all-containers
              echo "---------------- End of Logs for pod $POD:"
            done
          else
            echo "No pods found with label app.kubernetes.io/name=$APPLICATION_NAME in $NAMESPACE namespace"
            echo "Listing all pods in $NAMESPACE namespace:"
            kubectl get pods -n $NAMESPACE
          fi          

  publish-reports:
    needs: deploy-app-with-helm
    if: always()
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - name: Download Bruno reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bruno-reports-*
          path: _site/reports
          merge-multiple: false

      - name: Normalize report directories
        run: |
          shopt -s nullglob
          for dir in _site/reports/bruno-reports-*; do
            mv "$dir" "${dir#_site/reports/bruno-reports-}"
          done

      - name: Aggregate reports and OpenAPI spec from this commit
        id: aggregate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -o nounset
          set -o errexit
          set -o pipefail

          site="_site"
          mkdir -p "$site/reports"

          applications=""
          for report_dir in "$site/reports"/*; do
            [ -d "$report_dir" ] || continue
            applications="$applications $(basename "$report_dir")"
          done

          # The OpenAPI spec is attached to the Maven build artifact of the same
          # commit, so it does not have to be rebuilt here.
          openapi_published=false
          maven_run_id=$(gh api "repos/$REPO/actions/workflows/maven-build.yml/runs?head_sha=$HEAD_SHA&per_page=100" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | sort_by(.created_at) | reverse | .[0].id // empty')
          if [ -n "$maven_run_id" ]; then
            spec_dir="$site/.openapi-spec"
            if gh run download "$maven_run_id" --repo "$REPO" --name openapi-spec --dir "$spec_dir"; then
              spec_file=$(find "$spec_dir" -type f \( -name '*.yaml' -o -name '*.yml' \) | head -n 1)
              if [ -n "$spec_file" ]; then
                mkdir -p "$site/openapi"
                cp "$spec_file" "$site/openapi/apifirst.yaml"
                ruby -ryaml -rjson -rdate \
                  -e 'puts JSON.pretty_generate(YAML.safe_load(File.read(ARGV[0]), permitted_classes: [Date, Time], aliases: true))' \
                  "$spec_file" > "$site/openapi/apifirst.json"
                openapi_published=true
              fi
            else
              echo "::warning::Could not download openapi-spec from Maven build run $maven_run_id"
            fi
            rm -rf "$spec_dir"
          else
            echo "::warning::No successful Maven build run found for $HEAD_SHA - skipping OpenAPI"
          fi

          report_count=$(find "$site/reports" -name '*.html' -type f | wc -l)
          if [ "$report_count" -eq 0 ] && [ "$openapi_published" = false ]; then
            echo "::notice::No reports found for $HEAD_SHA - Pages is left untouched"
            echo "has_content=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_content=true" >> "$GITHUB_OUTPUT"
          echo "has_openapi=$openapi_published" >> "$GITHUB_OUTPUT"

          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            printf '%s\n' '<!doctype html><html lang="en"><head><meta charset="utf-8"><title>API reports</title></head><body>'
            printf '<h1>API reports</h1>\n'
            printf '<p>Commit: <code>%s</code></p>\n' "$HEAD_SHA"
            printf '<p>Deploy workflow run: <a href="%s">%s</a></p>\n' "$run_url" "$run_url"
            if [ "$openapi_published" = true ]; then
              printf '<h2>OpenAPI</h2>\n<ul>\n'
              printf '  <li><a href="openapi/">Swagger UI</a></li>\n'
              printf '  <li><a href="openapi/apifirst.yaml">apifirst.yaml</a></li>\n'
              printf '  <li><a href="openapi/apifirst.json">apifirst.json</a></li>\n'
              printf '</ul>\n'
            fi
            for application in $applications; do
              [ -d "$site/reports/$application" ] || continue
              printf '<h2>%s</h2>\n<ul>\n' "$application"
              for report in "$site/reports/$application"/*.html; do
                [ -f "$report" ] || continue
                report_name=$(basename "$report")
                printf '  <li><a href="reports/%s/%s">%s</a></li>\n' "$application" "$report_name" "$report_name"
              done
              printf '</ul>\n'
            done
            printf '%s\n' '</body></html>'
          } > "$site/index.html"

      - name: Set up Node.js for Swagger UI
        if: steps.aggregate.outputs.has_openapi == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Build Swagger UI page
        if: steps.aggregate.outputs.has_openapi == 'true'
        run: |
          set -o nounset
          set -o errexit
          set -o pipefail

          swagger_version=5.34.0
          install_dir=$(mktemp -d)
          npm install --no-save --no-audit --no-fund --prefix "$install_dir" \
            "swagger-ui-dist@$swagger_version" >/dev/null

          mkdir -p _site/openapi/swagger-ui
          cp "$install_dir/node_modules/swagger-ui-dist/swagger-ui.css" \
            "$install_dir/node_modules/swagger-ui-dist/swagger-ui-bundle.js" \
            _site/openapi/swagger-ui/

          cat > _site/openapi/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>apifirst OpenAPI</title>
            <link rel="stylesheet" href="swagger-ui/swagger-ui.css">
          </head>
          <body>
            <div id="swagger-ui"></div>
            <script src="swagger-ui/swagger-ui-bundle.js"></script>
            <script>
              window.ui = SwaggerUIBundle({
                url: "apifirst.yaml",
                dom_id: "#swagger-ui",
                presets: [SwaggerUIBundle.presets.apis],
                layout: "BaseLayout",
                deepLinking: true
              });
            </script>
          </body>
          </html>
          HTML

      - name: Configure Pages
        if: steps.aggregate.outputs.has_content == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      - name: Upload Pages artifact
        if: steps.aggregate.outputs.has_content == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          # Unique per attempt: re-runs would otherwise leave a second github-pages artifact.
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.aggregate.outputs.has_content == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Add report link to summary
        if: always() && steps.aggregate.outputs.has_content == 'true'
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          if [ -n "${PAGE_URL:-}" ]; then
            {
              echo "### API reports"
              echo "$PAGE_URL"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
